version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: restopsiq-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restopsiq
    ports:
      - '15432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
