[project]
name = "restopsiq-ai-dev-team"
version = "0.1.0"
description = "LangGraph-based AI agent development team for RestOpsIQ Platform"
requires-python = ">=3.11"

dependencies = [
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-anthropic>=0.2.0",
  "langchain-community>=0.3.0",
  "python-dotenv>=1.0.0",
  "gitpython>=3.1.40",
  "PyGithub>=2.3.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.scripts]
ai-dev = "ai_dev_team.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_dev_team"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
