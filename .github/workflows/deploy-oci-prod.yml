name: Deploy → OCI Producción

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "prisma/**"
      - "packages/**"
  workflow_dispatch:

concurrency:
  group: deploy-oci-prod
  cancel-in-progress: false # nunca cancelar un deploy en curso

env:
  OCIR_REGION: sa-bogota-1
  OCIR_REPO: sa-bogota-1.ocir.io/${{ secrets.OCI_NAMESPACE }}/opssynk/api

jobs:
  build-and-push:
    name: Build imagen AMD64 → OCIR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Generar tag (sha corto)
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login a OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGION }}.ocir.io
          username: ${{ secrets.OCI_NAMESPACE }}/${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push imagen (AMD64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.OCIR_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ env.OCIR_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH redeploy en OCI
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Redeploy contenedor con nueva imagen
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          IMAGE: ${{ env.OCIR_REPO }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ubuntu@${{ secrets.OCI_VM_HOST }} "
            echo '${{ secrets.OCIR_AUTH_TOKEN }}' | docker login ${{ env.OCIR_REGION }}.ocir.io \
              -u '${{ secrets.OCI_NAMESPACE }}/${{ secrets.OCIR_USERNAME }}' --password-stdin &&
            docker pull $IMAGE &&
            docker stop nomina-api 2>/dev/null || true &&
            docker rm nomina-api 2>/dev/null || true &&
            docker run -d --name nomina-api --restart unless-stopped \
              --network nomina-net \
              --env-file /opt/nomina.env \
              -p 3000:3000 \
              $IMAGE
          "

      - name: Verificar contenedor arrancó
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          sleep 10
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ubuntu@${{ secrets.OCI_VM_HOST }} \
            "docker ps --filter name=nomina-api --filter status=running | grep nomina-api"
