name: Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All jobs below are required status checks.
# Branch protection is configured to require ALL of them to pass before merge.

jobs:
  # ── 1. Typecheck ────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Typecheck all packages
        run: npm run typecheck

  # ── 2. ESLint ───────────────────────────────────────────────────────────────
  lint:
    name: ESLint (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Run ESLint (--max-warnings 0)
        run: npm run lint

  # ── 3. Prettier ─────────────────────────────────────────────────────────────
  format:
    name: Prettier (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Check formatting
        run: npm run format:check

  # ── 4. Stylelint (SCSS) ─────────────────────────────────────────────────────
  stylelint:
    name: Stylelint (SCSS rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Validate SCSS files
        run: npm run stylelint
      - name: Verify component SCSS naming convention
        # Every .tsx component must have a corresponding .module.scss (not a plain .scss)
        run: |
          PLAIN_CSS=$(find apps/web/src -name "*.scss" ! -name "*.module.scss" ! -path "*/styles/*" 2>/dev/null || true)
          if [ -n "$PLAIN_CSS" ]; then
            echo "❌ Component styles must use .module.scss, found plain .scss files:"
            echo "$PLAIN_CSS"
            exit 1
          fi
          echo "✅ All component styles use .module.scss"

  # ── 5. Facade Pattern Structure ─────────────────────────────────────────────
  facade-structure:
    name: NestJS Facade Pattern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Validate module structure & Facade pattern
        run: node scripts/validate-structure.js

  # ── 6. Unit Tests (API) ─────────────────────────────────────────────────────
  test-api-unit:
    name: Unit Tests — API (≥80% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Run unit tests with coverage
        run: npm run test:cov --workspace=apps/api
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage/

  # ── 7. Unit Tests (Web) ─────────────────────────────────────────────────────
  test-web-unit:
    name: Unit Tests — Web (≥80% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Run unit tests with coverage
        run: npm run test:cov --workspace=apps/web
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage/

  # ── 8. Integration Tests (API) ──────────────────────────────────────────────
  test-api-e2e:
    name: Integration Tests — API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: restopsiq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/restopsiq_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Run integration tests
        working-directory: apps/api
        run: npm run test:e2e

  # ── 9. Build ────────────────────────────────────────────────────────────────
  build:
    name: Build all apps
    runs-on: ubuntu-latest
    needs: [typecheck, lint, format, stylelint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Build packages and apps
        run: npm run build

  # ── Summary gate (all jobs must be green for branch protection) ─────────────
  quality-gate:
    name: ✅ All Quality Gates Passed
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - lint
      - format
      - stylelint
      - facade-structure
      - test-api-unit
      - test-web-unit
      - test-api-e2e
      - build
    if: always()
    steps:
      - name: Check all gate results
        run: |
          results=(
            "${{ needs.typecheck.result }}"
            "${{ needs.lint.result }}"
            "${{ needs.format.result }}"
            "${{ needs.stylelint.result }}"
            "${{ needs.facade-structure.result }}"
            "${{ needs.test-api-unit.result }}"
            "${{ needs.test-web-unit.result }}"
            "${{ needs.test-api-e2e.result }}"
            "${{ needs.build.result }}"
          )
          failed=0
          for r in "${results[@]}"; do
            if [ "$r" != "success" ]; then
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            echo "❌ One or more quality gates failed. Merge is blocked."
            exit 1
          fi
          echo "✅ All quality gates passed!"
