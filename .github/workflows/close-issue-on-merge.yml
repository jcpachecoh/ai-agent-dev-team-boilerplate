name: PR Merged → Close Issue

on:
  pull_request:
    types: [closed]
    branches: [main, develop]

jobs:
  close-issue:
    name: Close linked issue on PR merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Close linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;

            // Extract issue number from branch name (feature/42-*) or PR body
            const branchMatch = branch.match(/(?:feature|fix|chore)\/(\d+)/);
            const bodyMatches = (context.payload.pull_request.body || '').matchAll(/(?:closes?|fixes?|resolves?)\s+#(\d+)/gi);

            const issueNumbers = new Set();
            if (branchMatch) issueNumbers.add(parseInt(branchMatch[1]));
            for (const m of bodyMatches) issueNumbers.add(parseInt(m[1]));

            for (const issueNumber of issueNumbers) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed'
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `✅ Closed by PR #${prNumber}: **${prTitle}**`
                });

                console.log(`Closed issue #${issueNumber}`);
              } catch (err) {
                console.warn(`Could not close issue #${issueNumber}: ${err.message}`);
              }
            }
